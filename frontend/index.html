<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>PHPanel · 本地开发环境</title>
    <script>
      try { const mode=localStorage.getItem("phpanel-theme") || "system"; document.documentElement.dataset.theme=mode==="dark" || (mode==="system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
